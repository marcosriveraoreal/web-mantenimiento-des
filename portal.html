<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Proveedores — Atalaya Mining</title>
  <style>
    :root {
      --ink:       #0d1c1e;
      --ink-2:     #3a4f52;
      --ink-3:     #7a9196;
      --ink-4:     #b0c4c8;
      --teal-50:   #f2f8f9;
      --teal-100:  #e4f0f2;
      --border:    #dde6e8;
      --border-2:  #eef2f3;
      --surface-2: #f7fafa;
      --shadow-sm: 0 2px 8px rgba(13,28,30,.08), 0 1px 2px rgba(13,28,30,.04);
      --r-xl: 18px;
      --r-lg: 13px;
      --r-md:  9px;
      --r-sm:  6px;
      --primary:       #194447;
      --primary-hover: #1f565a;
      --tertiary:      #eb953f;
      --sidebar-w:     220px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--teal-50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Topbar ─────────────────────────────────────────────────────── */
    .topbar {
      background: var(--primary);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 20px 0 0;
      gap: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .topbar__brand {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      height: 100%;
      border-right: 1px solid rgba(255,255,255,.08);
    }

    .topbar__logo-mark {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .topbar__logo-mark svg { width: 32px; height: 32px; }

    .topbar__name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .topbar__right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .topbar__portal-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,.5);
      letter-spacing: .4px;
    }

    .topbar__user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .company-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 30px;
      padding: 5px 12px 5px 6px;
    }

    .company-badge__avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--tertiary);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: .3px;
    }

    .company-badge__name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .btn-logout {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--r-md);
      color: rgba(255,255,255,.7);
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .15s;
    }

    .btn-logout:hover {
      background: rgba(255,255,255,.14);
      color: #fff;
    }

    .btn-logout svg { width: 13px; height: 13px; }

    /* ── Layout ─────────────────────────────────────────────────────── */
    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 10px;
      gap: 2px;
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--ink-4);
      padding: 10px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 36px;
      padding: 0 10px;
      border-radius: var(--r-md);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }

    .nav-item svg {
      width: 15px;
      height: 15px;
      color: var(--ink-3);
      flex-shrink: 0;
      transition: color .15s;
    }

    .nav-item:hover {
      background: var(--teal-50);
      color: var(--primary);
    }

    .nav-item:hover svg { color: var(--primary); }

    .nav-item.active {
      background: var(--teal-100);
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item.active svg { color: var(--primary); }


    /* ── Main content ───────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-y: auto;
    }

    .main-inner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    /* ── Welcome placeholder ────────────────────────────────────────── */
    .welcome-card {
      text-align: center;
      max-width: 420px;
    }

    .welcome-card__icon {
      width: 64px;
      height: 64px;
      background: var(--teal-100);
      border-radius: var(--r-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 1px solid var(--border);
    }

    .welcome-card__icon svg {
      width: 28px;
      height: 28px;
      color: var(--primary);
    }

    .welcome-card__eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--ink-3);
      margin-bottom: 6px;
    }

    .welcome-card__title {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .welcome-card__subtitle {
      font-size: 13px;
      color: var(--ink-3);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar__brand">
      <div class="topbar__logo-mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
          <defs><style>.st0{fill:#fff}</style></defs>
          <path class="st0" d="M23.77,30.47l-8.22,6.82,6.25-1.21,1.96-5.6h.01Z"/>
          <path class="st0" d="M22.82,36.21l4.56,3.17-2.55-8.89-2.01,5.72Z"/>
          <path class="st0" d="M9.14,34.13l4.62,3.32,8.85-7.34-13.48,4.03h0Z"/>
          <path class="st0" d="M25.81,30.45l2.7,9.38,5.41-1.33-8.1-8.04h-.01Z"/>
          <path class="st0" d="M26.65,29.89l8.36,8.3,5.61-4.16-13.96-4.13h-.01Z"/>
          <path class="st0" d="M24.3,10.18l-15.35,22.87,15.35-4.58V10.18Z"/>
          <path class="st0" d="M25.63,28.46l15.42,4.56-15.42-22.85s0,18.29,0,18.29Z"/>
        </svg>
      </div>
      <span class="topbar__name">Atalaya Mining</span>
    </div>
    <div class="topbar__right">
      <span class="topbar__portal-label">Portal de Proveedores</span>
      <div class="topbar__user">
        <div class="company-badge">
          <div class="company-badge__avatar" id="companyAvatar">--</div>
          <span class="company-badge__name" id="companyName">Empresa</span>
        </div>
        <button class="btn-logout" id="btnLogout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <!-- Layout -->
  <div class="layout">

    <!-- Sidebar -->
    <nav class="sidebar">
      <span class="nav-section-label">Menú</span>

      <a class="nav-item" href="solicitudes.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        Solicitudes
      </a>

    </nav>

    <!-- Main -->
    <main class="main">
      <div class="main-inner">
        <div class="welcome-card">
          <div class="welcome-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <p class="welcome-card__eyebrow">Bienvenido</p>
          <h1 class="welcome-card__title" id="welcomeTitle">Portal de Proveedores</h1>
          <p class="welcome-card__subtitle">
            Aquí podrás gestionar tus ofertas y comunicarte con el equipo de Atalaya Mining.<br/>
            Selecciona una opción del menú para comenzar.
          </p>
        </div>
      </div>
    </main>

  </div>

  <script>
    /* Lee la sesión */
    const session = JSON.parse(sessionStorage.getItem('atalaya_session') || 'null');

    if (!session) {
      window.location.replace('login.html');
    } else {
      const initials = session.company
        .split(' ')
        .map(w => w[0])
        .join('')
        .toUpperCase()
        .slice(0, 2);

      document.getElementById('companyAvatar').textContent = initials;
      document.getElementById('companyName').textContent   = session.company;
      document.getElementById('welcomeTitle').textContent  = 'Bienvenido, ' + session.company;
      document.title = session.company + ' — Portal Proveedores';
    }

    document.getElementById('btnLogout').addEventListener('click', () => {
      sessionStorage.removeItem('atalaya_session');
      window.location.replace('login.html');
    });
  </script>

</body>
</html>
